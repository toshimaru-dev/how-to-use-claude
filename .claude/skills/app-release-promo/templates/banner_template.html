<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root {
    --brand-color: {{BRAND_COLOR}};
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    overflow: hidden;
  }
  .banner {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    background: linear-gradient(135deg, var(--brand-color) 0%, color-mix(in srgb, var(--brand-color) 60%, #ffffff) 100%);
    position: relative;
  }
  .icon {
    width: 160px;
    height: 160px;
    border-radius: 36px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    object-fit: cover;
    background: #ffffff;
  }
  .icon-placeholder {
    width: 160px;
    height: 160px;
    border-radius: 36px;
    background: rgba(255, 255, 255, 0.35);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  }
  .app-name {
    font-size: 56px;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    letter-spacing: 0.02em;
  }
  .catchphrase {
    font-size: 32px;
    font-weight: 600;
    color: #ffffff;
    text-align: center;
    max-width: 900px;
    line-height: 1.5;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
  }
  .badge {
    position: absolute;
    top: 36px;
    right: 48px;
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.25);
    padding: 10px 24px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="banner">
    <!-- RELEASE_BADGE: 新規リリース/アップデート等のバッジ。不要な場合はこの要素ごと削除 -->
    <div class="badge">{{RELEASE_BADGE}}</div>

    <!-- ICON_IMG: アイコン画像パスがある場合は <img class="icon" src="{{ICON_PATH}}">、無ければ <div class="icon-placeholder"></div> -->
    {{ICON_IMG}}

    <div class="app-name">{{APP_NAME}}</div>
    <div class="catchphrase">{{CATCHPHRASE}}</div>
  </div>
</body>
</html>
